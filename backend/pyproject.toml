[project]
name = "touchline"
version = "1.0.0"
description = "Explainable, personalized, multilingual match intelligence from synthetic football events."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "agent-framework-core>=1.22",
  "agent-framework-foundry>=1.0",
  "agent-framework-openai>=1.0",
  "agent-framework-a2a>=1.0.0b0",  # published as pre-release
  "azure-identity>=1.17",
  "mcp>=1.2",  # 1.x (FastMCP) and 2.x (MCPServer) both supported
]

[project.optional-dependencies]
azure = [
  "azure-eventhub>=5.12",
  "azure-cosmos>=4.7",
  "azure-messaging-webpubsubservice>=1.2",
  "azure-ai-contentsafety>=1.0",
  "azure-search-documents>=11.5",
  "azure-monitor-opentelemetry>=1.6",
]
data = ["pyarrow>=16", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
touchline = "touchline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["touchline*"]

[tool.setuptools.package-data]
touchline = ["agents/prompts/*.md", "i18n/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
