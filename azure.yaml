# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: touchline
metadata:
  template: touchline@1.0.0
infra:
  provider: bicep
  path: infra
  module: main
services:
  app:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
  functions:
    project: ./functions
    language: python
    host: function
hooks:
  postprovision:
    shell: sh
    run: echo "Touchline provisioned. App URL - $SERVICE_APP_URI"
