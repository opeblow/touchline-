name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "./backend[dev]"
      - run: ruff check backend/touchline backend/tests && ruff format --check backend/touchline backend/tests
      - run: pytest -q backend/tests
      - name: Evaluation report (realism + grounding)
        run: cd backend && python -m touchline.cli eval
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: docs/eval }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile && pnpm lint && pnpm build

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -e "./backend[dev]"
      - run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: End-to-end (80 checks on a fresh server)
        run: cd backend && python tests/e2e/run_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-report, path: docs/e2e }
